<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div>
        <label for="Name">Name:</label>
        <input type="text" name="Name" id="Name" placeholder="Enter your name">
    </div>
    <div>
         <label for="college">College</label>
        <input type="text" name="college" id="college" placeholder="college name">
    </div>
    <div>
        <label for="branch">Branch</label>
        <input type="text" name="branch" id="branch" placeholder="branch name">
    </div>
    <div>
        <label for="course">Course</label>
        <input type="text" name="course" id="course" placeholder="course name">
    </div>
    <div>
        <label for="year">Year</label>
        <input type="number" name="year" id="year" placeholder="year">
    </div>
    <div>
        <label for="phone number">Phone number</label>
        <input type="number" name="phone number" id="phone number" placeholder="Enter your phone number">
    </div>
    <div>
        <label for="Contact">Parents Number </label>
        <input type="number" name="Contact" id="Contact" placeholder="Enter Parents number">
    </div>
    

</body>
</html>
