<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light  text-light">
    
    <header class="p-2 text-center">
      <h2>Weather🌤️🌦️❄️</h2>
    </header>
    <main>
      <div class="container">
        <div class="weather-card p-4 text-center">

          <div class="weather-icon mb-3">
            <i class="bi bi-brightness-high-fill"></i>
          </div>

          <div class="mb-3">
            <input type="text" id="cityName" class="form-control" placeholder="Enter City Name"/>
          </div>

          <div>
            <button class="btn btn-primary px-4" onclick="getWeather()">GET WEATHER</button>
          </div>


          <div class="info-box">
            <h4>
              <i class="bi bi-thermometer-half"></i>
              Temperature:
              <span id="Temperature">30</span>°C
            </h4>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
