<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-dark text-light">
    
    <header class="p-2 text-center ">
      <h2>CURRENCY CONVERTOR APP</h2>
    </header>
    <main>
      <div class="container mt-4">

      <div class="row justify-content-center align-items-center">

        <!-- From Currency -->
        <div class="col-md-4 text-center mb-3">
<img id="fromFlag"
src="https://flagsapi.com/IN/flat/64.png"
class="flag-img">
          <select id="fromCurrency" class="form-select mt-2">
            <option value="INR">INDIA</option>
            <option value="USD">USA</option>
            <option value="EUR">EUR</option>
            <option value="GBP">UK</option>
            <option value="JPY">JAPAN</option>
          </select>
        </div>

        <!-- To Currency -->
        <div class="col-md-4 text-center mb-3">
<img id="toFlag"
src="https://flagsapi.com/US/flat/64.png"
class="flag-img">
          <select id="toCurrency" class="form-select mt-2">
            <option value="INR">INDIA</option>
            <option value="USD">USA</option>
            <option value="EUR">EUR</option>
            <option value="GBP">UK</option>
            <option value="JPY">JAPAN</option>
          </select>
        </div>

      </div>

      <!-- Amount -->
      <div class="row justify-content-center">
        <div class="col-md-2">
          <input type="number" id="amount" class="form-control">
        </div>
      </div>

      <!-- Button -->
      <div class="row justify-content-center mt-3">
        <div class="col-md-2">
          <button class="btn btn-danger w-100" onclick="convertCurrency()">
            Convert
          </button>
        </div>
      </div>

      <!-- Result -->
      <div class="row justify-content-center mt-3">
        <div class="col-md-4 text-center">
          <h3>Converted Amount :</h3>
          <h4 id="result">0</h4>
        </div>
      </div>

    </div>
  </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
