<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1><b>Pizza Order Form</b></h1>
    <div>
        <label for="firstName">First Name:</label>
        <input type="text" name="firstName" id="firstName">
    </div>
    
    <div>
        <label for="lastName">Last Name:</label>
        <input type="text" name="lastName" id="lastName">
    </div>
    <div>
         <label for="email">Email address:</label>
        <input type="email" name="email" id="email">
    </div>
    <div>
        <label for="phone">Contact number:</label>
        <input type="number" name="phone" id="phone">
    </div>
    <div>
        <label for="date">Preferred Delivery Date:</label>
        <input type="date" name="date" id="date"> 
    </div>
    <div>
        <label>Size:</label>
        <input type="radio" name="size" id="small" value="small"><span>small</span>
        <input type="radio" name="size" id="medium" value="medium"><span>medium</span>
        <input type="radio" name="size" id="large" value="large"><span>large</span>
    </div>
    <div>
        <label>Flavor:</label>
        <input type="checkbox" name="Flavor" id="Hawaiian (php 150.00)" value="Hawaiian (php 150.00)"><span>Hawaiian (php 150.00)</span>
        <select name="quantity">
                <option value="">1.</option>
                <option>2.</option>
                <option>3.</option>
                <option>4.</option>
              </select><br>

        <input type="checkbox" name="Flavor" id="pepproni (php 140,00)" value="pepproni (php 140,00)"><span>Pepproni (php 140,00)</span>
            <select name="quantity">
                <option value="">1.</option>
                <option>2.</option>
                <option>3.</option>
                <option>4.</option>
            </select><br>
        <input type="checkbox" name="Flavor" id="Vegetable (php 130.00)" value="Vegetable (php 130.00)"><span>Vegetable (php 130.00)</span>
        <select name="quantity">
                <option value="">1.</option>
                <option>2.</option>
                <option>3.</option>
                <option>4.</option>
              </select><br>
    </div>
    <div>
        <label for="cradit no">cradit card number:</label>
        <input type="number" name="cradit card number" id="cradit card number">
    </div>
    <div>
        <label for="pin">Pin:</label>
        <input type="number" name="pin" id="pin">
    </div>
    <div>
        <label for="Additional note">Additional note:</label>
        <textarea name="Additional note" id="Additional note"></textarea>
    </div>
    <button type="submit">Submit</button>

</body>
</html>
